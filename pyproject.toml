# formatting: wrap at column 100, the width pyre uses, so the two agree
[tool.black]
line-length = 100
# the versions of python the code is formatted for, the ones pyre supports; without an explicit
# list, black infers one file by file
target-version = ["py311", "py312", "py313", "py314"]


# the files the preamble and c++ formatting checks of pyre's {etc/ci/conventions/check.py} leave
# alone, as patterns: the graphql configuration is json, which cannot carry comments, and the
# license is kept as it is written
[tool.conventions]
exempt = [".graphqlconfig", "LICENSE"]


# spell checking of the prose in comments, docstrings, and documentation, the way pyre does it:
# {skip} leaves out binary files and the npm lock file, whose package names and hashes are not
# prose, {ignore-words} lists real words that codespell mistakes for misspellings, and
# {ignore-regex} leaves out mixed case identifiers such as {afterAll} or {selectReader}, which are
# code rather than prose
[tool.codespell]
skip = "*.graffle,*.nb,*.png,*.jpg,*.gif,*.ico,*.pdf,*.svg,*.woff,*.woff2,*.ttf,package-lock.json"
ignore-words = "etc/ci/conventions/codespell-words.txt"
ignore-regex = "\\b[a-z]+[A-Z][A-Za-z0-9]*\\b"


# end of file
