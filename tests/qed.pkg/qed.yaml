# the suite runs against an installation with no web client, so keep the complaint about its
# absence out of the output of every test that builds the app
qed.app:
    # by putting the channel under the control of the user
    journal:
        channels:
            - warning, qed.startup.assets

# and turning it off; the switch is addressed by the app's nickname, {qed}
qed.journal.warning.qed.startup.assets:
    active: no


# the archive
qed.native: .

# the dataset
d16:
    uri: "{qed.native}/c16.dat"
    shape: 65, 65
    cell: c16

    # configuration of the visualization pipeline: the controllers the channels share
    data.controllers:
        amplitude:
            auto: no
            min: -1.0
            low: -0.5
            high: 0.5
            max: 1.0
        phase:
            auto: no
            min: 0.2
            low: 0.3
            high: 0.5
            max: 0.6
        saturation:
            auto: no
            min: 0.2
            value: 0.4
            max: 0.6
    # and the ones that belong to a single channel
    data.real:
        range:
            auto: no
            min: 0
            low: 10
            high: 90
            max: 100
    data.imaginary:
        range:
            auto: no
            min: 0
            low: 10
            high: 90
            max: 100

    # the view defaults
    view:
        measure:
            active: yes
            closed: yes
            path: [[100,100], [500,500]]
            selection: [1]
        sync:
            channel: yes
            zoom: no
            scroll: no
            path: yes
        zoom:
            coupled: no
            horizontal: -1
            vertical: -2


# attach it to the application
datasets:
    - native.flat#d16


# end of file
