# the suite runs against an installation with no web client, so keep the complaint about its
# absence out of the output of every test that builds the app; the switch is addressed by the
# app's nickname, {qed}
qed.journal.warning.qed.startup.assets:
    active: no


# the archive
qed.native: .

# the dataset
d16:
    uri: "{qed.native}/c16.dat"
    shape: 65, 65
    cell: c16
    # the controllers its channels share, pinned to values the tests check
    data.controllers:
        amplitude:
            auto: no
            min: -1.0
            low: -0.5
            high: 0.5
            max: 1.0
        saturation:
            auto: no
            min: 0.2
            value: 0.4
            max: 0.6


# attach it to the application
datasets:
    - native.flat#d16


# end of file
