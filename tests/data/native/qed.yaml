# the archive root: the directory that holds the generated rasters (this directory)
qed.native: .

# the c16 (complex-double) fixture, emitted by the {c16} generator: a 3929x6049 raster of
# f(z) = (z-1)/(z^2+z+1) over (-2,2)^2 -- poles and a zero make every channel visually distinct
data_c16:
    uri: "{qed.native}/c16.dat"
    shape: 3929, 6049
    cell: c16

    # pin the controllers the channels share, so renders never depend on sampled statistics
    data.controllers:
        amplitude:
            auto: no
            min: 0.0
            low: 0.0
            high: 1.0
            max: 2.0
        phase:
            auto: yes
        saturation:
            auto: no
            min: 0.0
            value: 0.5
            max: 1.0

# attach the dataset to the application
datasets:
    - native.flat#data_c16


# change the default crew size
qed.nexus.teams.tile:
    size: 16

# run as a web app on a default test port; a runner launches {qed} from this directory and may
# override the port on the command line so parallel suites do not collide; the {nexus} node is
# not an application trait, so the override must use the fully qualified name, e.g.
#     qed --qed.app.nexus.services.web.address=ip4:0.0.0.0:<port>
qed.app:
    # the shell
    shell: web
    # the web server port
    nexus.services.web:
        address: ip4:0.0.0.0:8123
        address: ip4:0.0.0.0:8005
    # journal
    journal:
        # the list of interesting channels
        channels:
          - debug, pyre.viz
          - debug, qed.ux.tiles
          - debug, qed.ux.stats

# and turn them on: tile pipelines
qed.journal.debug.pyre.viz:
    active: no

# one line per tile request, with outcome and timings
qed.journal.debug.qed.ux.tiles:
    active: no

# and one line per statistics merge, with the running whole-dataset accumulation
qed.journal.debug.qed.ux.stats:
    active: no

# never spawn a browser; the test driver owns the browser
pyre.shells.web#qed.app.shell:
    auto: no


# end of file
